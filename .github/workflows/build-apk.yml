name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          mkdir -p android/app/src/main/assets/public
          mkdir -p android/capacitor-cordova-android-plugins

      - name: Sync Capacitor Android
        run: |
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle.log || {
            ERR=$(grep -E -A 8 "FAILURE:|error:|FAILED" gradle.log | head -n 25 | tr '\r\n' '  ')
            echo "::error title=Gradle Fail::$ERR"
            exit 1
          }

      - name: Prepare APK Output
        run: |
          mkdir -p output
          echo "=== Searching for any .apk files in workspace ==="
          find . -name "*.apk" -type f || true
          echo "=== Build directory tree ==="
          find android/app/build -maxdepth 4 || true
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          echo "Selected APK: '$APK_FILE'"
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" output/HomeSpace.apk
            ls -lh output/HomeSpace.apk
          else
            echo "::error::No APK file found in workspace!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeSpace-Android-App
          path: output/HomeSpace.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: HomeSpace Android APK (Latest)
          body: |
            📱 **HomeSpace Android Application (APK)**
            
            ไฟล์ APK สำหรับติดตั้งลงเครื่อง Android (เช่น Samsung Galaxy S25 Ultra):
            
            📥 [ดาวน์โหลด HomeSpace.apk](https://github.com/${{ github.repository }}/releases/download/apk-latest/HomeSpace.apk)
            
            **วิธีติดตั้งบนเครื่อง Android:**
            1. ดาวน์โหลดไฟล์ `HomeSpace.apk`
            2. แตะเปิดไฟล์แล้วเลือก "ติดตั้ง" (Install)
            3. หากระบบถาม ให้กดอนุญาต "ติดตั้งจากแหล่งที่ไม่รู้จัก" (Allow from this source)
          files: output/HomeSpace.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
